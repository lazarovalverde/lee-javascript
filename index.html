<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- v5: variables, operaciones, sangría con guías -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sigue el programa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #eef0f8;
    --panel: #ffffff;
    --panel-line: #d6daea;
    --text: #1d2140;
    --muted: #6a7096;
    --dot: #c9cee6;
    --player: #f59e0b;
    --player-glow: rgba(245, 158, 11, .45);
    --goal: #0d9488;
    --bad: #e11d48;
    --good: #059669;
    --run: #4f46e5;
    --code-key: #7c3aed;
    --code-num: #d97706;
    --code-fn: #2563eb;
    --code-str: #db2777;
    --code-com: #8a90b3;
    --guide: #dde0ee;
    --line-run: rgba(79, 70, 229, .12);
    --line-bad: rgba(225, 29, 72, .16);
    --line-good: rgba(5, 150, 105, .16);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10132a; --panel: #181c3a; --panel-line: #2b3160; --text: #e7e9fb; --muted: #8f96c9;
      --dot: #363c72; --player: #fbbf24; --player-glow: rgba(251, 191, 36, .5); --goal: #2dd4bf;
      --bad: #fb7185; --good: #34d399; --run: #818cf8; --code-key: #c4b5fd; --code-num: #fbbf24;
      --code-fn: #7dd3fc; --code-str: #f9a8d4; --code-com: #6b73ad; --guide: #2f3566; --line-run: rgba(129,140,248,.16);
      --line-bad: rgba(251,113,133,.2); --line-good: rgba(52,211,153,.2);
    }
  }
  :root[data-theme="dark"] {
    --bg: #10132a; --panel: #181c3a; --panel-line: #2b3160; --text: #e7e9fb; --muted: #8f96c9;
    --dot: #363c72; --player: #fbbf24; --player-glow: rgba(251, 191, 36, .5); --goal: #2dd4bf;
    --bad: #fb7185; --good: #34d399; --run: #818cf8; --code-key: #c4b5fd; --code-num: #fbbf24;
    --code-fn: #7dd3fc; --code-str: #f9a8d4; --code-com: #6b73ad; --guide: #2f3566; --line-run: rgba(129,140,248,.16);
    --line-bad: rgba(251,113,133,.2); --line-good: rgba(52,211,153,.2);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0; min-height: 100vh;
    background: var(--bg); color: var(--text);
    font-family: "Sora", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px 32px;
  }
  header { width: 100%; max-width: 1040px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  h1 { font-size: clamp(1.15rem, 2.6vw, 1.5rem); margin: 0; font-weight: 700; letter-spacing: -.01em; }
  .stats { display: flex; gap: 18px; font-size: .9rem; color: var(--muted); }
  .stats b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }

  /* ---------- Progreso de niveles ---------- */
  .progress { width: 100%; max-width: 1040px; margin-bottom: 18px; display: flex; flex-direction: column; gap: 8px; }
  .pill { display: flex; align-items: center; gap: 14px; background: var(--panel); border: 1px solid var(--panel-line); border-radius: 999px; padding: 8px 8px 8px 16px; }
  .track { position: relative; flex: 1; display: flex; align-items: center; gap: 7px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
  .track::-webkit-scrollbar { display: none; }
  .count { flex: none; font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; padding-right: 8px; }
  .count b { color: var(--text); }
  .dot {
    flex: none; width: 15px; height: 15px; padding: 0; border-radius: 50%; cursor: pointer;
    background: var(--bg); border: 2px solid var(--panel-line); color: var(--text);
    font: 700 .95rem/1 "Sora", system-ui, sans-serif; display: grid; place-items: center;
    transition: width .25s, height .25s, background .25s, border-color .25s;
  }
  .dot:hover { border-color: var(--muted); }
  .dot:focus-visible { outline: 3px solid var(--run); outline-offset: 2px; }
  .dot.done  { background: var(--good); border-color: var(--good); }
  .dot.retry { background: color-mix(in srgb, var(--good) 38%, var(--panel)); border-color: var(--good); }
  .dot.current { width: 38px; height: 38px; background: var(--panel); border: 3px solid var(--run); }
  .dot.current.done, .dot.current.retry { border-color: var(--good); }
  .dot.just { animation: dotPop .7s ease-out; }
  @keyframes dotPop { 35% { transform: scale(1.35); box-shadow: 0 0 0 8px color-mix(in srgb, var(--good) 28%, transparent); } }
  .dot.oops { animation: dotOops .45s ease-in-out; border-color: var(--bad); }
  @keyframes dotOops { 20%, 60% { transform: translateX(-4px); } 40%, 80% { transform: translateX(4px); } }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; font-size: .78rem; color: var(--muted); padding-left: 6px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 11px; height: 11px; border-radius: 50%; background: var(--bg); border: 2px solid var(--panel-line); }
  .legend i.done { background: var(--good); border-color: var(--good); }
  .legend i.retry { background: color-mix(in srgb, var(--good) 38%, var(--panel)); border-color: var(--good); }
  .legend button { margin-left: auto; border: 0; background: none; color: var(--muted); font: inherit; font-size: .78rem; text-decoration: underline; cursor: pointer; padding: 2px 4px; }
  .legend button:focus-visible { outline: 3px solid var(--run); outline-offset: 2px; }

  main { width: 100%; max-width: 1040px; display: grid; grid-template-columns: minmax(300px, 470px) 1fr; gap: 22px; align-items: start; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }

  /* ---------- Panel de código ---------- */
  .code {
    background: var(--panel); border: 1px solid var(--panel-line); border-radius: 12px; overflow: hidden;
    font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: .84rem;
  }
  .code-title { padding: 10px 14px; border-bottom: 1px solid var(--panel-line); color: var(--muted); font-size: .78rem; }
  .code ol { list-style: none; margin: 0; padding: 8px 0; counter-reset: l; position: relative; max-height: min(58vh, 500px); overflow: auto; }
  .code li { counter-increment: l; display: flex; align-items: stretch; min-height: 1.75em; line-height: 1.75; padding: 0 14px 0 0; white-space: pre; transition: background .2s; border-left: 3px solid transparent; }
  .code .txt { white-space: pre; }
  .code .tab { flex: none; width: 3ch; border-left: 1px solid var(--guide); }
  .code li::before { content: counter(l); width: 38px; flex: none; text-align: right; padding-right: 14px; color: var(--code-com); }
  .k { color: var(--code-key); } .n { color: var(--code-num); } .f { color: var(--code-fn); } .c { color: var(--code-com); } .s { color: var(--code-str); }
  .val { color: var(--code-num); font-weight: 600; }
  .live { margin-left: 10px; color: var(--code-num); }
  li.run  { background: var(--line-run);  border-left-color: var(--run); }
  li.bad  { background: var(--line-bad);  border-left-color: var(--bad); }
  li.good { background: var(--line-good); border-left-color: var(--good); }
  .log { border-top: 1px solid var(--panel-line); padding: 10px 14px; height: 116px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; color: var(--muted); }
  .log div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .log .e { color: var(--bad); } .log .o { color: var(--good); }

  /* ---------- Tablero ---------- */
  .stage { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .board-wrap {
    --cell: clamp(24px, min(calc((100vw - 96px) / 9.9), 54px), 54px);
    --gap: calc(var(--cell) * .16);
    --step: calc(var(--cell) + var(--gap));
    position: relative;
    padding: calc(var(--cell) * .55);
    background: var(--panel); border: 1px solid var(--panel-line); border-radius: 18px;
    transition: box-shadow .25s;
  }
  .board { position: relative; display: grid; grid-template-columns: repeat(9, var(--cell)); grid-auto-rows: var(--cell); gap: var(--gap); }
  .cell { border-radius: 50%; background: var(--dot); transition: background .25s, transform .25s; }
  .cell.goal { background: transparent; box-shadow: inset 0 0 0 3px var(--goal); animation: goalPulse 1.8s ease-in-out infinite; }
  .cell.block { background: var(--bad); transform: scale(.72); }
  @keyframes goalPulse { 50% { box-shadow: inset 0 0 0 3px var(--goal), 0 0 0 6px color-mix(in srgb, var(--goal) 22%, transparent); } }

  .player {
    position: absolute; left: 0; top: 0; width: var(--cell); height: var(--cell); border-radius: 50%;
    background: var(--player); box-shadow: 0 0 calc(var(--cell) * .5) var(--player-glow);
    transform: translate(calc(var(--x) * var(--step)), calc(var(--y) * var(--step)));
    transition: transform .14s cubic-bezier(.3,.8,.4,1.2), background .2s;
    z-index: 2; pointer-events: none;
  }
  .player.pop { animation: pop .18s ease-out; }
  @keyframes pop { 40% { scale: 1.14 .88; } 100% { scale: 1; } }
  .player.hurt { background: var(--bad); animation: hurt .5s ease-in-out; transition: transform .45s ease-in .35s, background .2s; }
  @keyframes hurt { 25% { scale: 1.35; } 50% { scale: .7; } 75% { scale: 1.1; } }

  .board-wrap.shake { animation: shake .42s cubic-bezier(.36,.07,.19,.97); }
  @keyframes shake { 10%,90% { transform: translateX(-2px); } 20%,80% { transform: translateX(5px); } 30%,50%,70% { transform: translateX(-9px); } 40%,60% { transform: translateX(9px); } }
  .board-wrap.flash-bad { box-shadow: 0 0 0 3px var(--bad), 0 0 30px color-mix(in srgb, var(--bad) 45%, transparent); }
  .board-wrap.flash-good { box-shadow: 0 0 0 3px var(--good), 0 0 40px color-mix(in srgb, var(--good) 45%, transparent); }

  .cell.wave { animation: wave .7s ease-out both; animation-delay: calc(var(--d) * 70ms); }
  @keyframes wave { 0% { transform: scale(1); } 40% { transform: scale(1.35); background: var(--good); } 100% { transform: scale(1); } }
  .cell.block.wave { animation-name: waveBlock; }
  @keyframes waveBlock { 40% { transform: scale(.95); background: var(--good); } 100% { transform: scale(.72); } }

  .banner {
    position: absolute; left: 50%; top: 50%; translate: -50% -50%; scale: .6; opacity: 0; pointer-events: none;
    padding: 10px 22px; border-radius: 999px; font-weight: 700; font-size: clamp(1rem, 3.4vw, 1.35rem); color: #fff; z-index: 5;
    transition: scale .25s cubic-bezier(.3,1.5,.5,1), opacity .2s; white-space: nowrap;
  }
  .banner.show { scale: 1; opacity: 1; }
  .banner.good { background: var(--good); } .banner.bad { background: var(--bad); }

  .tip { color: var(--muted); font-size: .88rem; max-width: 52ch; line-height: 1.55; display: flex; flex-direction: column; gap: 6px; }
  .tip p { margin: 0; }
  .tip code { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: .8rem; color: var(--text); }
  kbd { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: .8rem; padding: 1px 6px; border: 1px solid var(--panel-line); border-bottom-width: 2px; border-radius: 5px; background: var(--panel); }

  .pad { display: grid; grid-template-columns: repeat(3, 54px); grid-template-rows: repeat(2, 54px); gap: 6px; }
  .pad button { border: 1px solid var(--panel-line); background: var(--panel); color: var(--text); border-radius: 12px; font-size: 1.25rem; cursor: pointer; touch-action: manipulation; }
  .pad button:active { background: var(--line-run); }
  .pad .u { grid-column: 2; grid-row: 1; } .pad .l { grid-column: 1; grid-row: 2; } .pad .d { grid-column: 2; grid-row: 2; } .pad .r { grid-column: 3; grid-row: 2; }
  @media (hover: hover) and (pointer: fine) { .pad { display: none; } }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .actions button { border: 1px solid var(--panel-line); background: var(--panel); color: var(--text); padding: 8px 16px; border-radius: 999px; font: inherit; font-size: .88rem; cursor: pointer; }
  .pad button:focus-visible, .actions button:focus-visible { outline: 3px solid var(--run); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    .dot.just, .dot.oops { animation: none; }
    .cell.goal, .cell.wave, .board-wrap.shake, .player.pop, .player.hurt { animation: none; }
    .player { transition: none; }
  }
</style>
</head>
<body>

<header>
  <h1 id="title">Nivel 1: Secuencias</h1>
  <div class="stats">
    <span>Paso <b id="sStep">0/0</b></span>
    <span>Fallos <b id="sFails">0</b></span>
  </div>
</header>

<nav class="progress" aria-label="Progreso de niveles">
  <div class="pill">
    <div class="track" id="track"></div>
    <div class="count"><b id="progCount">0</b>/<span id="progTotal">26</span></div>
  </div>
  <div class="legend">
    <span><i class="done"></i>a la primera</span>
    <span><i class="retry"></i>con algún fallo</span>
    <span><i></i>pendiente</span>
    <button type="button" id="resetProg">Borrar progreso</button>
  </div>
</nav>

<main>
  <section class="code" aria-label="Programa a ejecutar">
    <div class="code-title">programa.js</div>
    <ol id="codeLines"></ol>
    <div class="log" id="log" aria-live="polite"></div>
  </section>

  <section class="stage">
    <div class="board-wrap" id="wrap">
      <div class="board" id="board" role="img" aria-label="Tablero de 9 por 9 círculos">
        <div class="player" id="player"></div>
      </div>
      <div class="banner" id="banner"></div>
    </div>
    <div class="tip" id="tip"></div>
    <div class="pad" aria-label="Controles táctiles">
      <button class="u" data-dir="up" aria-label="Arriba">↑</button>
      <button class="l" data-dir="left" aria-label="Izquierda">←</button>
      <button class="d" data-dir="down" aria-label="Abajo">↓</button>
      <button class="r" data-dir="right" aria-label="Derecha">→</button>
    </div>
    <div class="actions">
      <button id="restart">Reiniciar programa</button>
      <button id="another">Otro programa</button>
    </div>
  </section>
</main>

<script>
(function () {
  var N = 9;
  var DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  var DIRKEYS = ['up', 'down', 'left', 'right'];
  var NAMES = { up: 'arriba', down: 'abajo', left: 'izquierda', right: 'derecha' };
  var OPP = { up: 'down', down: 'up', left: 'right', right: 'left' };
  var KEYS = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right' };

  function rnd(n) { return Math.floor(Math.random() * n); }
  function pick(a) { return a[rnd(a.length)]; }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = rnd(i + 1), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function inB(x, y) { return x >= 0 && y >= 0 && x < N && y < N; }
  function key(x, y) { return x + ',' + y; }

  /* ============ Generador de niveles ============ */
  var LEVELS = [
    { title: 'Secuencias', plan: ['move', 'move', 'move'] },
    { title: 'Secuencias largas', plan: ['move', 'move', 'move', 'move', 'move', 'move'] },
    { title: 'Bucles for', plan: ['move', 'for', 'move'], forN: [2, 3], body2: 0 },
    { title: 'Bucles con varias líneas', plan: ['for', 'move', 'for'], forN: [2, 3], body2: 0.8 },
    { title: 'Condicionales', plan: ['move', 'if', 'move'] },
    { title: 'Más condicionales', plan: ['if', 'if', 'move', 'if'] },
    { title: 'for e if juntos', plan: ['for', 'if', 'move', 'if'], forN: [2, 3], body2: 0.5 },
    { title: 'Bucles while', plan: ['move', 'while', 'move'] },
    { title: 'while e if', plan: ['while', 'if', 'while'] },
    { title: 'Bucles y condicionales', plan: ['for', 'while', 'if', 'move'], forN: [2, 4], body2: 0.6 },
    { title: 'Funciones', plan: ['move', 'call', 'move'] },
    { title: 'Reutilizar funciones', plan: ['call', 'move', 'call', 'call'] },
    { title: 'Funciones con parámetros', plan: ['callp', 'move', 'callp'] },
    { title: 'Funciones y parámetros', plan: ['callp', 'call', 'callp', 'move'] },
    { title: 'Funciones con bucles', plan: ['move', 'callf', 'move', 'callf'] },
    { title: 'Parámetros y bucles', plan: ['callpf', 'move', 'callpf', 'callpf'] },
    { title: 'Funciones que llaman a funciones', plan: ['move', 'calln', 'move'] },
    { title: 'Funciones anidadas', plan: ['calln', 'move', 'calln'] },
    { title: 'Variables de texto', plan: ['vdir', 'move', 'vdir'] },
    { title: 'Variables numéricas', plan: ['vfor', 'move', 'vfor'] },
    { title: 'Operaciones con variables', plan: ['vforop', 'vforop', 'move'] },
    { title: 'while con contador', plan: ['move', 'vwhile', 'move'] },
    { title: 'while con saltos y límites', plan: ['vwhile2', 'move', 'vwhile2'] },
    { title: 'Condicionales con variables', plan: ['vforop', 'vif', 'vif'], body2: 0.3 },
    { title: 'Variables y funciones', plan: ['vforop', 'vfunc', 'vfunc'] },
    { title: 'Todo con variables', plan: ['vforop', 'vwhile2', 'vif', 'vfunc'], body2: 0.4 }
  ];
  var MIXED_TITLE = 'Programa mixto';
  function levelTitle(level) { return level <= LEVELS.length ? LEVELS[level - 1].title : MIXED_TITLE; }

  function levelCfg(level) {
    if (level <= LEVELS.length) {
      var l = LEVELS[level - 1];
      return { plan: l.plan, forN: l.forN || [2, 3], body2: l.body2 || 0 };
    }
    var pool = ['for', 'if', 'while', 'call', 'callp', 'callf', 'callpf', 'calln', 'vdir', 'vfor', 'vforop', 'vwhile', 'vwhile2', 'vif', 'vfunc', 'if', 'for', 'while', 'vforop', 'move'];
    var len = Math.min(5 + Math.floor((level - LEVELS.length - 1) / 2), 9);
    shuffle(pool);
    return { plan: pool.slice(0, len), forN: [2, 4], body2: 0.5 };
  }

  function mvNode(d) { return { t: 'move', d: d }; }

  function randSeq(len) {
    var seq = [];
    for (var i = 0; i < len; i++) {
      var prev = seq[i - 1];
      seq.push(pick(DIRKEYS.filter(function (d) { return !prev || d !== OPP[prev]; })));
    }
    return seq;
  }
  function makeSimple() { return [{ t: 'def', name: '', param: false, body: randSeq(2 + rnd(2)).map(mvNode) }]; }
  function makeLoopFn() {
    var d1 = pick(DIRKEYS);
    var d2 = pick(DIRKEYS.filter(function (x) { return x !== d1 && x !== OPP[d1]; }));
    var f = { t: 'for', n: 2 + rnd(2), body: [mvNode(d1)] };
    return [{ t: 'def', name: '', param: false, body: Math.random() < 0.5 ? [f, mvNode(d2)] : [mvNode(d2), f] }];
  }
  function makeNested() {
    var inner = { t: 'def', name: '', param: false, body: randSeq(2).map(mvNode) };
    var callIn = { t: 'call', def: inner };
    var extra = mvNode(pick(DIRKEYS));
    var outer = { t: 'def', name: '', param: false, body: Math.random() < 0.5 ? [callIn, extra] : [extra, callIn] };
    return [inner, outer];
  }
  function makeParam(withFor) {
    var k = 2 + rnd(2), body = [];
    if (withFor) body.push({ t: 'for', n: k, body: [{ t: 'movevar' }] });
    else for (var i = 0; i < k; i++) body.push({ t: 'movevar' });
    return { t: 'def', name: withFor ? 'recorrer' : 'avanzar', param: true, body: body };
  }

  // Desenrolla el cuerpo de una función en la lista de pasos que se ejecutan
  function headText(def, arg, cnt) {
    return 'dir = "' + NAMES[arg] + '"' + (def.count ? ', veces = ' + cnt : '');
  }
  function expandItems(items, arg, def, cnt) {
    var out = [];
    items.forEach(function (it) {
      if (it.t === 'move') out.push({ d: it.d, lines: [it], live: [] });
      else if (it.t === 'movevar') out.push({ d: arg, lines: [it], live: [{ node: def, text: headText(def, arg, cnt) }] });
      else if (it.t === 'for') {
        var total = it.nParam ? cnt : it.n;
        for (var i = 0; i < total; i++) {
          it.body.forEach(function (bd) {
            var live = [{ node: it, text: 'i = ' + i }];
            if (bd.t === 'movevar') live.push({ node: def, text: headText(def, arg, cnt) });
            out.push({ d: bd.t === 'move' ? bd.d : arg, lines: [it, bd], live: live });
          });
        }

  // Expresión (texto JS válido) cuyo valor es target
  function exprFor(target, ops) {

    if (target >= 2) { a = 1 + rnd(target - 1); opts.push(a + ' + ' + (target - a)); }
    for (f = 2; f <= target; f++) if (target % f === 0 && target / f >= 2) opts.push(f + ' * ' + (target / f));

  }

  function gen(level) {
    var cfg = levelCfg(level), plan = cfg.plan;
    var pos = { x: rnd(N), y: rnd(N) }, start = { x: pos.x, y: pos.y };
    var blocks = {}, visited = {}, reserved = {}, prog = [], trace = [], defs = [], slots = {};
    var vars = {}, dirVar = null, pend = [];
    var nameQ = shuffle(['escalera', 'zigzag', 'esquina', 'gancho', 'salto', 'rampa', 'camino', 'ruta']);
    var varQ = shuffle(['pasos', 'cuenta', 'total', 'saltos', 'n', 'altura', 'ancho', 'pisos']);

    function isFree(x, y) { return inB(x, y) && !blocks[key(x, y)]; }
    function adv(d) { pos = { x: pos.x + DIRS[d][0], y: pos.y + DIRS[d][1] }; visited[key(pos.x, pos.y)] = 1; }
    function freeDirs() { return DIRKEYS.filter(function (d) { return isFree(pos.x + DIRS[d][0], pos.y + DIRS[d][1]); }); }
    function placeable(x, y) { var k = key(x, y); return inB(x, y) && !blocks[k] && !visited[k] && !reserved[k]; }
    function fits(steps) {
      var x = pos.x, y = pos.y;
      for (var i = 0; i < steps.length; i++) {
        x += DIRS[steps[i].d][0]; y += DIRS[steps[i].d][1];

      }
      return true;
    }
    function runFits(d, k) {
      var x = pos.x, y = pos.y;

    }
    function ev(text) {
      var names = [], vals = [];
      Object.keys(vars).forEach(function (n) { names.push(n); vals.push(vars[n].value); });
      return Function.apply(null, names.concat('return (' + text + ');')).apply(null, vals);
    }
    function varLive() {
      var out = [];
      Object.keys(vars).forEach(function (n) { out.push({ node: vars[n].node, text: n + ' = ' + vars[n].value }); });
      if (dirVar) out.push({ node: dirVar.node, text: 'direccion = "' + NAMES[dirVar.value] + '"' });
      return out;
    }
    function pushStep(d, lines, live) {
      trace.push({ d: d, lines: pend.concat(lines), live: (live || []).concat(varLive()) });

    }
    function emit(callNode, steps) {
      steps.forEach(function (st) {
        adv(st.d);

    }
    // Busca una dirección (o secuencia de 1-2 direcciones) que se pueda repetir k veces
    function findBody(k, len) {
      for (var tr = 0; tr < 40; tr++) {
        var b = [];
        for (var j = 0; j < len; j++) b.push(pick(DIRKEYS));
        if (len === 2 && OPP[b[0]] === b[1]) continue;
        var px = pos.x, py = pos.y, ok = true;
        for (var i = 0; i < k && ok; i++) {
          for (var j2 = 0; j2 < len; j2++) {

          }

      }

    }

    for (var pi = 0; pi < plan.length; pi++) {
      var t = plan[pi], node, d;

      if (t === 'move') {
        var fd0 = freeDirs();
        if (!fd0.length) return null;
        d = pick(fd0);
        node = { t: 'move', d: d };
        prog.push(node); adv(d);
        pushStep(d, [node], []);

      } else if (t === 'for') {
        var n = cfg.forN[0] + rnd(cfg.forN[1] - cfg.forN[0] + 1);
        var bodyLen = Math.random() < cfg.body2 ? 2 : 1;
        var body = findBody(n, bodyLen);
        if (!body) return null;
        node = { t: 'for', n: n, body: body.map(mvNode) };
        prog.push(node);
        for (var ii = 0; ii < n; ii++) {
          for (var jj = 0; jj < bodyLen; jj++) {
            adv(body[jj]);
            pushStep(body[jj], [node, node.body[jj]], [{ node: node, text: 'i = ' + ii }]);
          }
        }

      } else if (t === 'if') {
        var wantTrue = Math.random() < 0.5, order = shuffle(DIRKEYS.slice()), cd = null, blockedNow = false, cx, cy;
        for (var k = 0; k < order.length; k++) {
          var kd = order[k];
          cx = pos.x + DIRS[kd][0]; cy = pos.y + DIRS[kd][1];
          var bl = !isFree(cx, cy);
          if (wantTrue) {
            if (bl) { cd = kd; blockedNow = true; break; }
            if (placeable(cx, cy)) {
              blocks[key(cx, cy)] = 1;
              if (freeDirs().length) { cd = kd; blockedNow = true; break; }
              delete blocks[key(cx, cy)];
            }
          } else if (!bl) {
            cd = kd; blockedNow = false; reserved[key(cx, cy)] = 1; break;
          }
        }
        if (cd === null) {
          cd = order[0];
          cx = pos.x + DIRS[cd][0]; cy = pos.y + DIRS[cd][1];
          blockedNow = !isFree(cx, cy);
          if (!blockedNow) reserved[key(cx, cy)] = 1;
        }
        var fd = freeDirs();
        if (!fd.length) return null;
        var taken = blockedNow ? pick(fd) : (Math.random() < 0.6 ? cd : pick(fd));
        var untaken = pick(DIRKEYS.filter(function (x) { return x !== taken; }));
        node = {
          t: 'if', cd: cd,
          thenMove: { t: 'move', d: blockedNow ? taken : untaken },
          elseMove: { t: 'move', d: blockedNow ? untaken : taken }

        prog.push(node);
        adv(taken);
        pushStep(taken, [node, blockedNow ? node.thenMove : node.elseMove], []);

      } else if (t === 'while') {
        var ord = shuffle(DIRKEYS.slice()), chosen = null, count = 0;
        for (var q = 0; q < ord.length && !chosen; q++) {
          var wd = ord[q], dx = DIRS[wd][0], dy = DIRS[wd][1];
          var L = 0, x = pos.x, y = pos.y;
          while (isFree(x + dx, y + dy) && L < 10) { x += dx; y += dy; L++; }
          if (L < 1) continue;
          var m = null;
          if (L >= 3 && (L > 5 || Math.random() < 0.6)) {
            var cands = [];
            for (var mm = 2; mm <= Math.min(L, 5); mm++) {
              if (placeable(pos.x + dx * mm, pos.y + dy * mm)) cands.push(mm);
            }
            if (cands.length) {
              m = pick(cands);
              blocks[key(pos.x + dx * m, pos.y + dy * m)] = 1;
              count = m - 1;
            }
          }
          if (m === null) {
            if (L <= 5) count = L; else continue;
          }
          chosen = wd;
        }
        if (!chosen) return null;
        node = { t: 'while', d: chosen, body: { t: 'move', d: chosen } };
        prog.push(node);
        for (var w = 0; w < count; w++) {
          adv(chosen);
          pushStep(chosen, [node, node.body], []);
        }

      } else if (t === 'call' || t === 'callf' || t === 'calln') {
        var mainDef = slots[t];
        if (!mainDef) {
          var made = null;
          for (var ftr = 0; ftr < 40 && !made; ftr++) {
            var cand = t === 'call' ? makeSimple() : (t === 'callf' ? makeLoopFn() : makeNested());
            var md = cand[cand.length - 1];
            if (fits(expandItems(md.body, null, md))) made = cand;
          }
          if (!made) return null;
          made.forEach(function (df) { df.name = nameQ.pop(); defs.push(df); });
          mainDef = slots[t] = made[made.length - 1];
        }
        var steps = expandItems(mainDef.body, null, mainDef);
        if (!fits(steps)) return null;
        node = { t: 'call', def: mainDef };
        prog.push(node);
        emit(node, steps);

      } else if (t === 'callp' || t === 'callpf') {
        var pdef = slots[t];
        if (!pdef) { pdef = makeParam(t === 'callpf'); defs.push(pdef); slots[t] = pdef; }
        var okDirs = DIRKEYS.filter(function (dd) { return fits(expandItems(pdef.body, dd, pdef)); });
        if (!okDirs.length) return null;
        var arg = pick(okDirs);

      } else if (t === 'vdir') {

        if (!d1opts.length) return null;

        if (!d2opts.length) return null;
        var d2 = pick(d2opts);

        prog.push(n2); pend.push(n2);
        dirVar = { value: d2, node: n2 };

        var lo, hi;
        if (wcmp === '<') { lo = wstart + (wk - 1) * wstep + 1; hi = wstart + wk * wstep; }
        else { lo = wstart + (wk - 1) * wstep; hi = wstart + wk * wstep - 1; }
        var wL = lo + rnd(hi - lo + 1);
        var useVar = !simple && limQ.length > 0 && Math.random() < 0.5;
        var wbl = (!simple && Math.random() < cfg.body2) ? 2 : 1;
        var wb = findBody(wk, wbl);
        if (!wb) return null;
        var cname = cntQ.shift();
        var letC = { t: 'let', name: cname, text: String(wstart) };
        prog.push(letC); pend.push(letC);
        var limText = String(wL);
        if (useVar) {
          var lname = limQ.shift();

      } else if (t === 'vif') {
        var vnames = Object.keys(vars), reuse = vnames.length > 0 && Math.random() < 0.7, iname, ival;
        if (reuse) { iname = pick(vnames); ival = vars[iname].value; }
        else {
          if (!varQ.length) return null;

          vars[iname] = { value: ival, node: ln0 };

        if (form === '>') { nn = wantT ? rnd(ival) : ival + rnd(3); ctext = iname + ' > ' + nn; }
        else if (form === '<') { nn = wantT ? ival + 1 + rnd(3) : Math.max(0, ival - rnd(3)); ctext = iname + ' < ' + nn; }
        else if (form === '==') { nn = wantT ? ival : ival + (Math.random() < 0.5 ? 1 : -1); if (nn < 0) nn = ival + 1; ctext = iname + ' == ' + nn; }
        else ctext = iname + ' % 2 == 0';
        var truth = !!ev(ctext);
        var fdv = freeDirs();
        if (!fdv.length) return null;
        var tk = pick(fdv), ut = pick(DIRKEYS.filter(function (x) { return x !== tk; }));
        node = { t: 'ifv', cond: ctext, thenMove: mvNode(truth ? tk : ut), elseMove: mvNode(truth ? ut : tk) };
        prog.push(node);
        adv(tk);
        pushStep(tk, [node, truth ? node.thenMove : node.elseMove], []);

      } else if (t === 'vfunc') {
        var cdef = slots.vfunc;
        if (!cdef) {
          cdef = { t: 'def', name: 'caminar', param: true, count: true, body: [{ t: 'for', nParam: true, nVar: 'veces', body: [{ t: 'movevar' }] }] };
          defs.push(cdef); slots.vfunc = cdef;
        }
        var opts = [];

          var v = vars[nm].value;
          [[nm, v], [nm + ' + 1', v + 1], [nm + ' - 1', v - 1], [nm + ' * 2', v * 2]].forEach(function (pr) {

          });
        });

        if (opts.length && Math.random() < 0.85) chosenOpt = pick(opts);
        else { var lv0 = 1 + rnd(4); chosenOpt = { text: String(lv0), val: lv0 }; }

        if (!dopts.length) return null;

        node = { t: 'call', def: cdef, arg: cdir, cntText: chosenOpt.text, cnt: chosenOpt.val };

    while (extra > 0 && guard++ < 400) {

  }

  function makeLevel(level) {

  }

  /* ============ DOM ============ */
  var board = document.getElementById('board');
  var wrap = document.getElementById('wrap');
  var playerEl = document.getElementById('player');
  var banner = document.getElementById('banner');
  var logEl = document.getElementById('log');
  var codeOl = document.getElementById('codeLines');
  var tipEl = document.getElementById('tip');
  var cells = [];
  for (var i = 0; i < N * N; i++) {
    var c = document.createElement('div');
    c.className = 'cell';
    board.insertBefore(c, playerEl);
    cells.push(c);
  }

  /* ---------- Progreso guardado ---------- */
  var STORE = 'sigueElPrograma.v2';
  var done = {};
  try {
    var raw = localStorage.getItem(STORE);
    if (raw) done = JSON.parse(raw) || {};
    else {
      // migración desde la versión anterior (el nivel 19 era entonces el mixto)
      var old = localStorage.getItem('sigueElPrograma.v1');
      if (old) { done = JSON.parse(old) || {}; delete done[19]; }
    }
  } catch (e) { done = {}; }
  function saveDone() { try { localStorage.setItem(STORE, JSON.stringify(done)); } catch (e) {} }
  function firstPending() {
    for (var i = 1; i <= LEVELS.length; i++) if (!done[i]) return i;
    return LEVELS.length + 1;
  }
  var trackEl = document.getElementById('track');
  var countEl = document.getElementById('progCount');

  function renderProgress(just) {
    var cur = Math.min(state.level, LEVELS.length + 1), count = 0;
    trackEl.innerHTML = '';
    for (var i = 1; i <= LEVELS.length + 1; i++) {
      var b = document.createElement('button');
      var st = done[i];
      b.type = 'button';
      b.className = 'dot';
      if (st) { b.classList.add(st === 'ok' ? 'done' : 'retry'); if (i <= LEVELS.length) count++; }
      var label = i <= LEVELS.length ? i + '. ' + LEVELS[i - 1].title : i + '+ ' + MIXED_TITLE;
      if (i === cur) { b.classList.add('current'); b.textContent = state.level; }
      if (i === just) b.classList.add('just');
      b.title = label;
      b.setAttribute('aria-label', 'Nivel ' + label + (st ? ', completado' : '') + (i === cur ? ', nivel actual' : ''));
      b.dataset.level = i;
      trackEl.appendChild(b);
    }
    countEl.textContent = count;
    document.getElementById('progTotal').textContent = LEVELS.length;
    var c = trackEl.querySelector('.current');
    if (c) trackEl.scrollLeft = Math.max(0, c.offsetLeft - trackEl.clientWidth / 2 + c.offsetWidth / 2);
  }
  trackEl.addEventListener('click', function (e) {
    var b = e.target.closest('.dot');
    if (!b) return;
    state.level = parseInt(b.dataset.level, 10);
    loadLevel();
    b.blur();
  });

  var state = { level: firstPending(), levelFails: 0, lastLoaded: 0, fails: 0, stepIndex: 0, start: null, goal: null, player: null, blocks: {}, trace: [], prog: [], locked: false };
  var lis = [];
  var timers = [];
  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
  function retrigger(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

  /* ---------- Construcción del código ---------- */
  function mv(d) { return '<span class="f">mover</span>(<span class="s">"' + NAMES[d] + '"</span>);'; }
  function cond(d) { return '<span class="f">bloqueado</span>(<span class="s">"' + NAMES[d] + '"</span>)'; }
  function hl(text) {
    return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\b\d+\b/g, '<span class="n">$&</span>');
  }

  function buildCode(lv) {
    var rows = [];
    function add(html, node, L) { if (node) node.line = rows.length; rows.push({ h: html, l: L || 0 }); }

    function renderNode(n, L) {
      switch (n.t) {
        case 'move': add(mv(n.d), n, L); break;
        case 'movevar': add('<span class="f">mover</span>(dir);', n, L); break;
        case 'movevarg': add('<span class="f">mover</span>(' + n.name + ');', n, L); break;
        case 'call':
          add('<span class="f">' + n.def.name + '</span>(' +
            (n.def.param ? '<span class="s">"' + NAMES[n.arg] + '"</span>' : '') +
            (n.def.count ? ', ' + hl(n.cntText) : '') + ');', n, L);
          break;
        case 'let': add('<span class="k">let</span> ' + n.name + ' = ' + hl(n.text) + ';<span class="live"></span>', n, L); break;
        case 'assign': add(n.name + ' = ' + hl(n.text) + ';<span class="live"></span>', n, L); break;
        case 'inc': add(hl(n.text) + ';', n, L); break;
        case 'letdir': add('<span class="k">let</span> ' + n.name + ' = <span class="s">"' + NAMES[n.v] + '"</span>;<span class="live"></span>', n, L); break;
        case 'assigndir': add(n.name + ' = <span class="s">"' + NAMES[n.v] + '"</span>;<span class="live"></span>', n, L); break;
        case 'for':
          add('<span class="k">for</span> (<span class="k">let</span> i = <span class="n">0</span>; i &lt; ' +
            (n.nVar ? n.nVar : '<span class="n">' + n.n + '</span>') + '; i++) {<span class="live"></span>', n, L);
          n.body.forEach(function (b) { renderNode(b, L + 1); });
          add('}', null, L);
          break;
        case 'if':
          add('<span class="k">if</span> (' + cond(n.cd) + ') {', n, L);
          renderNode(n.thenMove, L + 1);
          add('} <span class="k">else</span> {', null, L);
          renderNode(n.elseMove, L + 1);
          add('}', null, L);
          break;
        case 'ifv':
          add('<span class="k">if</span> (' + hl(n.cond) + ') {', n, L);
          renderNode(n.thenMove, L + 1);
          add('} <span class="k">else</span> {', null, L);
          renderNode(n.elseMove, L + 1);
          add('}', null, L);
          break;
        case 'while':
          add('<span class="k">while</span> (!' + cond(n.d) + ') {', n, L);
          renderNode(n.body, L + 1);
          add('}', null, L);
          break;
        case 'wc':
          add('<span class="k">while</span> (' + hl(n.cond) + ') {<span class="live"></span>', n, L);
          n.body.forEach(function (b) { renderNode(b, L + 1); });
          renderNode(n.inc, L + 1);
          add('}', null, L);
          break;
      }
    }

    add('<span class="c">// Ejecuta el programa con las flechas</span>');
    add('<span class="k">let</span> jugador = { x: <span class="val" id="vpx">0</span>, y: <span class="val" id="vpy">0</span> };');
    add('<span class="k">let</span> meta    = { x: <span class="val">' + lv.goal.x + '</span>, y: <span class="val">' + lv.goal.y + '</span> };');
    add('');
    lv.defs.forEach(function (df) {
      add('<span class="k">function</span> <span class="f">' + df.name + '</span>(' + (df.count ? 'dir, veces' : df.param ? 'dir' : '') + ') {' +
        (df.param ? '<span class="live"></span>' : ''), df, 0);
      df.body.forEach(function (b) { renderNode(b, 1); });
      add('}');
      add('');
    });
    lv.prog.forEach(function (n) { renderNode(n, 0); });

    codeOl.innerHTML = '';
    lis = rows.map(function (r) {
      var li = document.createElement('li');
      var tabs = '';
      for (var i = 0; i < r.l; i++) tabs += '<span class="tab"></span>';
      li.innerHTML = tabs + '<span class="txt">' + r.h + '</span>';
      codeOl.appendChild(li);
      return li;
    });
    codeOl.scrollTop = 0;
  }

  function clearLive() { codeOl.querySelectorAll('.live').forEach(function (s) { s.textContent = ''; }); }
  function clearMarks() { lis.forEach(function (li) { li.classList.remove('run', 'bad', 'good'); }); }
  function mark(nodes, cls) {
    clearMarks();
    nodes.forEach(function (n) { lis[n.line].classList.add(cls); });
    var li = lis[nodes[nodes.length - 1].line];
    if (li.offsetTop < codeOl.scrollTop + 8) codeOl.scrollTop = Math.max(0, li.offsetTop - 8);
    else if (li.offsetTop + li.offsetHeight > codeOl.scrollTop + codeOl.clientHeight - 8) codeOl.scrollTop = li.offsetTop + li.offsetHeight - codeOl.clientHeight + 8;
  }

  /* ---------- Tablero y estado ---------- */
  function paintBoard() {
    for (var y = 0; y < N; y++) for (var x = 0; x < N; x++) {
      var el = cells[y * N + x];
      el.className = 'cell';
      el.style.removeProperty('--d');
      if (state.blocks[key(x, y)]) el.classList.add('block');
      if (x === state.goal.x && y === state.goal.y) el.classList.add('goal');
    }
  }
  function placePlayer(p) {
    playerEl.style.setProperty('--x', p.x);
    playerEl.style.setProperty('--y', p.y);
  }
  function paintValues() {
    var a = document.getElementById('vpx'), b = document.getElementById('vpy');
    if (a) a.textContent = state.player.x;
    if (b) b.textContent = state.player.y;
    document.getElementById('sStep').textContent = state.stepIndex + '/' + state.trace.length;
    document.getElementById('sFails').textContent = state.fails;
    document.getElementById('title').textContent = 'Nivel ' + state.level + ': ' + levelTitle(state.level);
  }

  function log(text, cls) {
    var d = document.createElement('div');
    d.textContent = '> ' + text;
    if (cls) d.className = cls;
    logEl.appendChild(d);
    while (logEl.children.length > 6) logEl.removeChild(logEl.firstChild);
  }

  function showBanner(text, cls) {
    banner.textContent = text;
    banner.className = 'banner ' + cls;
    void banner.offsetWidth;
    banner.classList.add('show');
    later(function () { banner.classList.remove('show'); }, 1000);
  }

  function paintTip(plan) {
    var has = {};
    plan.forEach(function (t) { has[t] = 1; });
    var h = '<p>Pulsa la flecha que indica cada <code>mover()</code>, en el orden en que se ejecutaría el programa.</p>';
    if (has['for']) h += '<p><code>for</code> repite su bloque: cuenta las vueltas y sigue todas las líneas de dentro en cada una.</p>';
    if (has['if']) h += '<p><code>bloqueado("dir")</code> es verdadero si, desde donde estás ahora, hay un círculo rojo o el borde del tablero en esa dirección. Si es verdadero se ejecuta el primer bloque; si no, el <code>else</code>.</p>';
    if (has['while']) h += '<p><code>while</code> repite mientras su condición se cumpla: avanzas hasta que <code>bloqueado(dir)</code> sea verdadero.</p>';
    var hasFn = has['call'] || has['callp'] || has['callf'] || has['callpf'] || has['calln'] || has['vfunc'];
    if (hasFn) h += '<p>Una función agrupa líneas con un nombre y no hace nada hasta que se la llama. Cada llamada ejecuta todo su cuerpo, y puede llamarse varias veces.</p>';
    if (has['callp'] || has['callpf']) h += '<p>En <code>avanzar("abajo")</code> el parámetro <code>dir</code> vale <code>"abajo"</code> mientras dura esa llamada.</p>';
    if (has['callf'] || has['callpf']) h += '<p>Si una función contiene un <code>for</code>, cada llamada ejecuta todas sus vueltas.</p>';
    if (has['calln']) h += '<p>Una función puede llamar a otra: cuando la interna termina, la externa sigue con su siguiente línea.</p>';
    var hasVar = has['vdir'] || has['vfor'] || has['vforop'] || has['vwhile'] || has['vwhile2'] || has['vif'] || has['vfunc'];
    if (hasVar) h += '<p>Una variable guarda un valor con nombre; si se reasigna, cambia para las líneas siguientes. Calcula su valor en tu cabeza: tras tu primera flecha verás junto a su línea el valor que tenía.</p>';
    if (has['vforop'] || has['vfor']) h += '<p>El bucle repite tantas veces como valga la variable en ese momento. Las operaciones (<code>+</code>, <code>-</code>, <code>*</code>) se resuelven en orden.</p>';
    if (has['vwhile'] || has['vwhile2']) h += '<p><code>c++</code> suma 1 a <code>c</code> y <code>c += 2</code> suma 2. El <code>while</code> comprueba la condición antes de cada vuelta; con <code>&lt;=</code> el límite también cuenta.</p>';
    if (has['vif']) h += '<p><code>%</code> es el resto de dividir: <code>n % 2 == 0</code> es verdadero si <code>n</code> es par. <code>==</code> compara si dos valores son iguales.</p>';
    if (has['vfunc']) h += '<p>Los argumentos pueden ser variables u operaciones (<code>pasos + 1</code>): se calculan antes de entrar en la función.</p>';
    tipEl.innerHTML = h;
  }

  /* ---------- Flujo de niveles ---------- */
  function loadLevel() {
    timers.forEach(clearTimeout); timers = [];
    banner.classList.remove('show');
    wrap.classList.remove('flash-good', 'flash-bad', 'shake');
    playerEl.classList.remove('hurt');
    var lv = makeLevel(state.level);
    state.start = lv.start; state.goal = lv.goal; state.blocks = lv.blocks;
    state.trace = lv.trace; state.prog = lv.prog;
    state.stepIndex = 0; state.player = { x: lv.start.x, y: lv.start.y };
    buildCode(lv);
    paintBoard();
    playerEl.style.transition = 'none';
    placePlayer(state.player);
    void playerEl.offsetWidth;
    playerEl.style.transition = '';
    state.locked = false;
    if (state.lastLoaded !== state.level) { state.levelFails = 0; state.lastLoaded = state.level; }
    paintTip(lv.plan);
    paintValues();
    renderProgress();
    log('nivel ' + state.level + ': ' + lv.trace.length + ' pasos');
  }

  function restartProgram() {
    timers.forEach(clearTimeout); timers = [];
    banner.classList.remove('show');
    wrap.classList.remove('flash-good', 'flash-bad', 'shake');
    playerEl.classList.remove('hurt');
    state.stepIndex = 0;
    state.player = { x: state.start.x, y: state.start.y };
    playerEl.style.transition = 'none';
    placePlayer(state.player);
    void playerEl.offsetWidth;
    playerEl.style.transition = '';
    clearMarks(); clearLive();
    state.locked = false;
    paintValues();
  }

  function fail(pressed) {
    var exp = state.trace[state.stepIndex];
    state.fails++; state.levelFails++; state.locked = true;
    var curDot = trackEl.querySelector('.current');
    if (curDot) retrigger(curDot, 'oops');
    log('✗ mover("' + NAMES[pressed] + '"): la línea pedía mover("' + NAMES[exp.d] + '")', 'e');
    mark(exp.lines, 'bad');

    var nx = state.player.x + DIRS[pressed][0], ny = state.player.y + DIRS[pressed][1];
    if (inB(nx, ny)) { state.player = { x: nx, y: ny }; placePlayer(state.player); }
    retrigger(wrap, 'shake');
    wrap.classList.add('flash-bad');
    playerEl.classList.add('hurt');
    showBanner('¡Fallo!', 'bad');
    later(function () { wrap.classList.remove('flash-bad'); }, 600);
    later(function () {
      state.player = { x: state.start.x, y: state.start.y };
      state.stepIndex = 0;
      placePlayer(state.player);
      paintValues();
    }, 30);
    later(function () {
      playerEl.classList.remove('hurt');
      clearMarks(); clearLive();
      state.locked = false;
      log('programa reiniciado');
    }, 1000);
    paintValues();
  }

  function win() {
    state.locked = true;
    var last = state.trace[state.trace.length - 1];
    mark(last.lines, 'good');
    log('¡programa completado! nivel ' + state.level + ' superado', 'o');
    var idx = Math.min(state.level, LEVELS.length + 1);
    done[idx] = (state.levelFails === 0 || done[idx] === 'ok') ? 'ok' : 'retry';
    saveDone();
    renderProgress(idx);
    wrap.classList.add('flash-good');
    showBanner('¡Acierto!', 'good');
    var g = state.goal;
    cells.forEach(function (el, i) {
      var x = i % N, y = Math.floor(i / N);
      el.style.setProperty('--d', Math.abs(x - g.x) + Math.abs(y - g.y));
      el.classList.remove('wave'); void el.offsetWidth; el.classList.add('wave');
    });
    later(function () { state.level++; loadLevel(); }, 1600);
  }

  function press(dir) {
    if (state.locked) return;
    var exp = state.trace[state.stepIndex];
    if (dir !== exp.d) { fail(dir); return; }

    state.player = { x: state.player.x + DIRS[dir][0], y: state.player.y + DIRS[dir][1] };
    placePlayer(state.player);
    retrigger(playerEl, 'pop');
    state.stepIndex++;
    log('mover("' + NAMES[dir] + '")');
    clearLive();
    var groups = {};
    (exp.live || []).forEach(function (l) {
      var g = groups[l.node.line] || (groups[l.node.line] = []);
      if (g.indexOf(l.text) < 0) g.push(l.text);
    });
    Object.keys(groups).forEach(function (ln) {
      var span = lis[ln].querySelector('.live');
      if (span) span.textContent = '// ' + groups[ln].join(', ');
    });
    paintValues();
    if (state.stepIndex >= state.trace.length) { win(); return; }
    mark(exp.lines, 'run');
  }

  document.addEventListener('keydown', function (e) {
    var dir = KEYS[e.key];
    if (!dir) return;
    e.preventDefault();
    if (e.repeat) return;
    press(dir);
  });
  document.querySelectorAll('.pad button').forEach(function (b) {
    b.addEventListener('click', function () { press(b.dataset.dir); });
  });
  var resetBtn = document.getElementById('resetProg'), resetTimer = null;
  resetBtn.addEventListener('click', function () {
    if (!resetTimer) {
      resetBtn.textContent = '¿Seguro? Pulsa otra vez';
      resetTimer = setTimeout(function () { resetBtn.textContent = 'Borrar progreso'; resetTimer = null; }, 3000);
      return;
    }
    clearTimeout(resetTimer); resetTimer = null;
    resetBtn.textContent = 'Borrar progreso';
    done = {}; saveDone();
    state.level = 1; state.fails = 0;
    loadLevel();
  });
  document.getElementById('restart').addEventListener('click', restartProgram);
  document.getElementById('another').addEventListener('click', loadLevel);

  loadLevel();
})();
</script>
</body>
