<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- v6: meta oculta, preguntas de predicción, explicación por paso, demostración, while como for, funciones sin llamar -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sigue el programa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #eef0f8;
    --panel: #ffffff;
    --panel-line: #d6daea;
    --text: #1d2140;
    --muted: #6a7096;
    --dot: #c9cee6;
    --player: #f59e0b;
    --player-glow: rgba(245, 158, 11, .45);
    --goal: #0d9488;
    --bad: #e11d48;
    --good: #059669;
    --run: #4f46e5;
    --code-key: #7c3aed;
    --code-num: #d97706;
    --code-fn: #2563eb;
    --code-str: #db2777;
    --code-com: #8a90b3;
    --guide: #dde0ee;
    --line-run: rgba(79, 70, 229, .12);
    --line-bad: rgba(225, 29, 72, .16);
    --line-good: rgba(5, 150, 105, .16);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10132a; --panel: #181c3a; --panel-line: #2b3160; --text: #e7e9fb; --muted: #8f96c9;
      --dot: #363c72; --player: #fbbf24; --player-glow: rgba(251, 191, 36, .5); --goal: #2dd4bf;
      --bad: #fb7185; --good: #34d399; --run: #818cf8; --code-key: #c4b5fd; --code-num: #fbbf24;
      --code-fn: #7dd3fc; --code-str: #f9a8d4; --code-com: #6b73ad; --guide: #2f3566; --line-run: rgba(129,140,248,.16);
      --line-bad: rgba(251,113,133,.2); --line-good: rgba(52,211,153,.2);
    }
  }
  :root[data-theme="dark"] {
    --bg: #10132a; --panel: #181c3a; --panel-line: #2b3160; --text: #e7e9fb; --muted: #8f96c9;
    --dot: #363c72; --player: #fbbf24; --player-glow: rgba(251, 191, 36, .5); --goal: #2dd4bf;
    --bad: #fb7185; --good: #34d399; --run: #818cf8; --code-key: #c4b5fd; --code-num: #fbbf24;
    --code-fn: #7dd3fc; --code-str: #f9a8d4; --code-com: #6b73ad; --guide: #2f3566; --line-run: rgba(129,140,248,.16);
    --line-bad: rgba(251,113,133,.2); --line-good: rgba(52,211,153,.2);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0; min-height: 100vh;
    background: var(--bg); color: var(--text);
    font-family: "Sora", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px 32px;
  }
  header { width: 100%; max-width: 1040px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  h1 { font-size: clamp(1.15rem, 2.6vw, 1.5rem); margin: 0; font-weight: 700; letter-spacing: -.01em; }
  .stats { display: flex; gap: 18px; font-size: .9rem; color: var(--muted); }
  .stats b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }

  /* ---------- Progreso de niveles ---------- */
  .progress { width: 100%; max-width: 1040px; margin-bottom: 18px; display: flex; flex-direction: column; gap: 8px; }
  .pill { display: flex; align-items: center; gap: 14px; background: var(--panel); border: 1px solid var(--panel-line); border-radius: 999px; padding: 8px 8px 8px 16px; }
  .track { position: relative; flex: 1; display: flex; align-items: center; gap: 7px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
  .track::-webkit-scrollbar { display: none; }
  .count { flex: none; font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; padding-right: 8px; }
  .count b { color: var(--text); }
  .dot {
    flex: none; width: 15px; height: 15px; padding: 0; border-radius: 50%; cursor: pointer;
    background: var(--bg); border: 2px solid var(--panel-line); color: var(--text);
    font: 700 .95rem/1 "Sora", system-ui, sans-serif; display: grid; place-items: center;
    transition: width .25s, height .25s, background .25s, border-color .25s;
  }
  .dot:hover { border-color: var(--muted); }
  .dot:focus-visible { outline: 3px solid var(--run); outline-offset: 2px; }
  .dot.done  { background: var(--good); border-color: var(--good); }
  .dot.retry { background: color-mix(in srgb, var(--good) 38%, var(--panel)); border-color: var(--good); }
  .dot.current { width: 38px; height: 38px; background: var(--panel); border: 3px solid var(--run); }
  .dot.current.done, .dot.current.retry { border-color: var(--good); }
  .dot.just { animation: dotPop .7s ease-out; }
  @keyframes dotPop { 35% { transform: scale(1.35); box-shadow: 0 0 0 8px color-mix(in srgb, var(--good) 28%, transparent); } }
  .dot.oops { animation: dotOops .45s ease-in-out; border-color: var(--bad); }
  @keyframes dotOops { 20%, 60% { transform: translateX(-4px); } 40%, 80% { transform: translateX(4px); } }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; font-size: .78rem; color: var(--muted); padding-left: 6px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 11px; height: 11px; border-radius: 50%; background: var(--bg); border: 2px solid var(--panel-line); }
  .legend i.done { background: var(--good); border-color: var(--good); }
  .legend i.retry { background: color-mix(in srgb, var(--good) 38%, var(--panel)); border-color: var(--good); }
  .legend button { margin-left: auto; border: 0; background: none; color: var(--muted); font: inherit; font-size: .78rem; text-decoration: underline; cursor: pointer; padding: 2px 4px; }
  .legend button:focus-visible { outline: 3px solid var(--run); outline-offset: 2px; }

  main { width: 100%; max-width: 1040px; display: grid; grid-template-columns: minmax(300px, 470px) 1fr; gap: 22px; align-items: start; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }

  /* ---------- Panel de código ---------- */
  .code {
    background: var(--panel); border: 1px solid var(--panel-line); border-radius: 12px; overflow: hidden;
    font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: .84rem;
  }
  .code-title { padding: 10px 14px; border-bottom: 1px solid var(--panel-line); color: var(--muted); font-size: .78rem; }
  .code ol { list-style: none; margin: 0; padding: 8px 0; counter-reset: l; position: relative; max-height: min(52vh, 460px); overflow: auto; }
  #codeLines > li { counter-increment: l; display: flex; align-items: stretch; min-height: 1.75em; line-height: 1.75; padding: 0 14px 0 0; white-space: pre; transition: background .2s; border-left: 3px solid transparent; }
  .code .txt { white-space: pre; }
  .code .tab { flex: none; width: 3ch; border-left: 1px solid var(--guide); }
  #codeLines > li::before { content: counter(l); width: 38px; flex: none; text-align: right; padding-right: 14px; color: var(--code-com); }
  .k { color: var(--code-key); } .n { color: var(--code-num); } .f { color: var(--code-fn); } .c { color: var(--code-com); } .s { color: var(--code-str); }
  .val { color: var(--code-num); font-weight: 600; }
  .live { margin-left: 10px; color: var(--code-num); }
  li.run  { background: var(--line-run);  border-left-color: var(--run); }
  li.bad  { background: var(--line-bad);  border-left-color: var(--bad); }
  li.good { background: var(--line-good); border-left-color: var(--good); }
  li.askline { outline: 2px dashed var(--run); outline-offset: -2px; }

  /* ---------- Partes de un bucle (inicio, comprobación, cuerpo, aumento) ---------- */
  .ph.on { background: color-mix(in srgb, var(--run) 30%, transparent); border-radius: 4px; outline: 2px solid var(--run); outline-offset: 1px; }
  .ph.on.exit { background: color-mix(in srgb, var(--bad) 22%, transparent); outline-color: var(--bad); }
  #codeLines > li.phase { background: color-mix(in srgb, var(--run) 26%, transparent); border-left-color: var(--run); }
  .phl { list-style: none; margin: 0 0 8px; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .phl li { padding: 4px 8px; border-radius: 8px; border-left: 3px solid transparent; opacity: .5; transition: opacity .2s, background .2s; }
  .phl li.past { opacity: .85; }
  .phl li.on { opacity: 1; color: var(--text); background: var(--bg); border-left-color: var(--run); }

  /* ---------- Explicación de cada paso ---------- */
  .explain { border-top: 1px solid var(--panel-line); padding: 12px 14px 14px; min-height: 156px; max-height: 270px; overflow: auto; font-family: "Sora", system-ui, sans-serif; font-size: .84rem; line-height: 1.55; color: var(--muted); }
  .explain .ex-head { color: var(--text); font-weight: 600; margin-bottom: 6px; }
  .explain .ex-head.bad { color: var(--bad); }
  .explain .ex-head.good { color: var(--good); }
  .explain ul { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 5px; }
  .explain code, .ask code, .tip code { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: .78rem; color: var(--text); background: var(--bg); padding: 1px 5px; border-radius: 5px; }

  /* ---------- Tablero ---------- */
  .stage { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .board-wrap {
    --cell: clamp(24px, min(calc((100vw - 96px) / 9.9), 54px), 54px);
    --gap: calc(var(--cell) * .16);
    --step: calc(var(--cell) + var(--gap));
    position: relative;
    padding: calc(var(--cell) * .55);
    background: var(--panel); border: 1px solid var(--panel-line); border-radius: 18px;
    transition: box-shadow .25s;
  }
  .board { position: relative; display: grid; grid-template-columns: repeat(9, var(--cell)); grid-auto-rows: var(--cell); gap: var(--gap); }
  .cell { border-radius: 50%; background: var(--dot); transition: background .25s, transform .25s; }
  .cell.goal { background: transparent; box-shadow: inset 0 0 0 3px var(--goal); animation: goalPulse 1.8s ease-in-out infinite; }
  .cell.block { background: var(--bad); transform: scale(.72); }
  @keyframes goalPulse { 50% { box-shadow: inset 0 0 0 3px var(--goal), 0 0 0 6px color-mix(in srgb, var(--goal) 22%, transparent); } }

  .player {
    position: absolute; left: 0; top: 0; width: var(--cell); height: var(--cell); border-radius: 50%;
    background: var(--player); box-shadow: 0 0 calc(var(--cell) * .5) var(--player-glow);
    translate: calc(var(--x) * var(--step)) calc(var(--y) * var(--step));
    transition: translate .14s cubic-bezier(.3,.8,.4,1.2), background .2s;
    z-index: 2; pointer-events: none;
  }
  .player.pop { animation: pop .18s ease-out; }
  @keyframes pop { 40% { scale: 1.14 .88; } 100% { scale: 1; } }
  .player.hurt { background: var(--bad); animation: hurt .5s ease-in-out; transition: translate .45s ease-in .35s, background .2s; }
  @keyframes hurt { 25% { scale: 1.35; } 50% { scale: .7; } 75% { scale: 1.1; } }

  .board-wrap.shake { animation: shake .42s cubic-bezier(.36,.07,.19,.97); }
  @keyframes shake { 10%,90% { transform: translateX(-2px); } 20%,80% { transform: translateX(5px); } 30%,50%,70% { transform: translateX(-9px); } 40%,60% { transform: translateX(9px); } }
  .board-wrap.flash-bad { box-shadow: 0 0 0 3px var(--bad), 0 0 30px color-mix(in srgb, var(--bad) 45%, transparent); }
  .board-wrap.flash-good { box-shadow: 0 0 0 3px var(--good), 0 0 40px color-mix(in srgb, var(--good) 45%, transparent); }

  .cell.wave { animation: wave .7s ease-out both; animation-delay: calc(var(--d) * 70ms); }
  @keyframes wave { 0% { transform: scale(1); } 40% { transform: scale(1.35); background: var(--good); } 100% { transform: scale(1); } }
  .cell.block.wave { animation-name: waveBlock; }
  @keyframes waveBlock { 40% { transform: scale(.95); background: var(--good); } 100% { transform: scale(.72); } }

  .banner {
    position: absolute; left: 50%; top: 50%; translate: -50% -50%; scale: .6; opacity: 0; pointer-events: none;
    padding: 10px 22px; border-radius: 999px; font-weight: 700; font-size: clamp(1rem, 3.4vw, 1.35rem); color: #fff; z-index: 5;
    transition: scale .25s cubic-bezier(.3,1.5,.5,1), opacity .2s; white-space: nowrap;
  }
  .banner.show { scale: 1; opacity: 1; }
  .banner.good { background: var(--good); } .banner.bad { background: var(--bad); } .banner.info { background: var(--run); }

  /* ---------- Pregunta de predicción ---------- */
  .ask { margin: 0 12px 12px; background: var(--panel); border: 2px solid var(--run); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; font-family: "Sora", system-ui, sans-serif; font-size: .84rem; }
  .ask[hidden] { display: none; }
  .ask.enter { animation: askIn .3s ease-out; }
  @keyframes askIn { from { opacity: 0; translate: 0 8px; } }
  .ask.shake { animation: shake .42s cubic-bezier(.36,.07,.19,.97); }
  .ask.answered { border-color: var(--good); }
  .ask-q { font-weight: 600; font-size: .95rem; line-height: 1.45; }
  .ask-line { display: inline-block; font-family: "JetBrains Mono", ui-monospace, monospace; font-size: .76rem; font-weight: 400; color: var(--run); border: 1px dashed var(--run); border-radius: 6px; padding: 0 6px; margin-right: 6px; }
  .ask-opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .ask-opts button { border: 1px solid var(--panel-line); background: var(--bg); color: var(--text); border-radius: 10px; padding: 8px 14px; font: inherit; font-size: .9rem; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
  .ask-opts button:hover:not(:disabled) { border-color: var(--run); }
  .ask-opts button:focus-visible { outline: 3px solid var(--run); outline-offset: 2px; }
  .ask-opts button.wrong { border-color: var(--bad); color: var(--bad); opacity: .7; }
  .ask-opts button.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--panel)); }
  .ask-opts button:disabled { cursor: default; }
  .ask-opts kbd { font-size: .72rem; }
  .ask-msg { font-size: .85rem; line-height: 1.5; color: var(--muted); min-height: 1.5em; }
  .ask-msg.bad { color: var(--bad); }
  .ask-msg.ok { color: var(--good); }

  .tip { color: var(--muted); font-size: .88rem; max-width: 52ch; line-height: 1.55; display: flex; flex-direction: column; gap: 6px; }
  .tip p { margin: 0; }
  kbd { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: .8rem; padding: 1px 6px; border: 1px solid var(--panel-line); border-bottom-width: 2px; border-radius: 5px; background: var(--panel); }

  .pad { display: grid; grid-template-columns: repeat(3, 54px); grid-template-rows: repeat(2, 54px); gap: 6px; }
  .pad button { border: 1px solid var(--panel-line); background: var(--panel); color: var(--text); border-radius: 12px; font-size: 1.25rem; cursor: pointer; touch-action: manipulation; }
  .pad button:active { background: var(--line-run); }
  .pad .u { grid-column: 2; grid-row: 1; } .pad .l { grid-column: 1; grid-row: 2; } .pad .d { grid-column: 2; grid-row: 2; } .pad .r { grid-column: 3; grid-row: 2; }
  @media (hover: hover) and (pointer: fine) { .pad { display: none; } }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .actions button { border: 1px solid var(--panel-line); background: var(--panel); color: var(--text); padding: 8px 16px; border-radius: 999px; font: inherit; font-size: .88rem; cursor: pointer; }
  .actions button.demo { border-color: var(--run); color: var(--run); }
  .actions button[hidden] { display: none; }
  .pad button:focus-visible, .actions button:focus-visible { outline: 3px solid var(--run); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    .dot.just, .dot.oops, .ask.enter, .ask.shake { animation: none; }
    .cell.goal, .cell.wave, .board-wrap.shake, .player.pop, .player.hurt { animation: none; }
    .player { transition: none; }
  }
</style>
</head>
<body>

<header>
  <h1 id="title">Nivel 1: Secuencias</h1>
  <div class="stats">
    <span>Paso <b id="sStep">0/0</b></span>
    <span>Fallos <b id="sFails">0</b></span>
  </div>
</header>

<nav class="progress" aria-label="Progreso de niveles">
  <div class="pill">
    <div class="track" id="track"></div>
    <div class="count"><b id="progCount">0</b>/<span id="progTotal">29</span></div>
  </div>
  <div class="legend">
    <span><i class="done"></i>a la primera</span>
    <span><i class="retry"></i>con fallos o ayudas</span>
    <span><i></i>pendiente</span>
    <button type="button" id="resetProg">Borrar progreso</button>
  </div>
</nav>

<main>
  <section class="code" aria-label="Programa a ejecutar">
    <div class="code-title">programa.js</div>
    <ol id="codeLines"></ol>
    <div class="ask" id="ask" hidden role="group" aria-labelledby="askQ">
      <div class="ask-q" id="askQ"></div>
      <div class="ask-opts" id="askOpts"></div>
      <div class="ask-msg" id="askMsg" aria-live="polite"></div>
    </div>
    <div class="explain" id="explain" aria-live="polite"></div>
  </section>

  <section class="stage">
    <div class="board-wrap" id="wrap">
      <div class="board" id="board" role="img" aria-label="Tablero de 9 por 9 círculos">
        <div class="player" id="player"></div>
      </div>
      <div class="banner" id="banner"></div>
    </div>
    <div class="tip" id="tip"></div>
    <div class="pad" aria-label="Controles táctiles">
      <button class="u" data-dir="up" aria-label="Arriba">↑</button>
      <button class="l" data-dir="left" aria-label="Izquierda">←</button>
      <button class="d" data-dir="down" aria-label="Abajo">↓</button>
      <button class="r" data-dir="right" aria-label="Derecha">→</button>
    </div>
    <div class="actions">
      <button id="demo" class="demo">▶ Ver ejecución</button>
      <button id="hint">Ver la meta (pista)</button>
      <button id="restart">Reiniciar programa</button>
      <button id="another">Otro programa</button>
    </div>
  </section>
</main>

<script>
(function () {
  var N = 9;
  var DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  var DIRKEYS = ['up', 'down', 'left', 'right'];
  var NAMES = { up: 'arriba', down: 'abajo', left: 'izquierda', right: 'derecha' };
  var OPP = { up: 'down', down: 'up', left: 'right', right: 'left' };
  var KEYS = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right' };
  var HIDE_GOAL_FROM = 3;   // a partir de este nivel la meta no se ve: hay que ejecutar el código

  function rnd(n) { return Math.floor(Math.random() * n); }
  function pick(a) { return a[rnd(a.length)]; }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = rnd(i + 1), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function inB(x, y) { return x >= 0 && y >= 0 && x < N && y < N; }
  function key(x, y) { return x + ',' + y; }

  /* ============ Textos de explicación ============ */
  function fmt(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/`([^`]+)`/g, '<code>$1</code>');
  }
  function subst(text, name, val) { return text.replace(new RegExp('\\b' + name + '\\b', 'g'), String(val)); }
  function joinList(arr) { return arr.length <= 1 ? arr.join('') : arr.slice(0, -1).join(', ') + ' y ' + arr[arr.length - 1]; }

  function stmtText(b) {
    if (b.t === 'move') return '`mover("' + NAMES[b.d] + '")`';
    if (b.t === 'movevar') return '`mover(dir)`';
    return 'las líneas de dentro';
  }
  // i++ , i = i + 1 e i += 1 hacen lo mismo
  function incEquiv(text, name) {
    var forms = /\+ 2$|\+= 2$/.test(text) ? [name + ' += 2', name + ' = ' + name + ' + 2'] : [name + '++', name + ' = ' + name + ' + 1', name + ' += 1'];
    return '`' + text + '` es lo mismo que ' + forms.filter(function (f) { return f !== text; }).map(function (f) { return '`' + f + '`'; }).join(' y ');
  }
  // Las 4 partes de cada vuelta de un for, en orden: inicio (1ª vez), comprobación, cuerpo, aumento
  function forNarr(i, total, j, len, limText, it, bd) {
    var why = [], phases = [], isNum = /^\d+$/.test(limText);
    if (j === 0) {
      if (i === 0) {
        phases.push({ k: 'init', node: it, text: '① Inicialización (solo la primera vez): `let i = 0` → `i` vale 0.' });
        why.push('Es lo mismo que: `let i = 0; while (i < ' + limText + ') { …; i++; }`');
      }

  var LEVELS = [

    { title: 'while e if', plan: ['while', 'if', 'while'] },

    { title: 'Funciones y parámetros', plan: ['callp', 'call', 'callp', 'move'] },
    { title: 'Funciones con bucles', plan: ['move', 'callf', 'move', 'callf'] },
    { title: 'Parámetros y bucles', plan: ['callpf', 'move', 'callpf', 'callpf'] },

    { title: 'Variables numéricas', plan: ['vfor', 'move', 'vfor'] },

          break;
        case 'wc':
          add('<span class="k">while</span> (<span class="ph ph-cond">' + hl(n.cond) + '</span>) {<span class="live"></span>', n, L);
          n.body.forEach(function (b) { renderNode(b, L + 1); });
          renderNode(n.inc, L + 1);
          add('}', null, L);
          break;
      }
    }

    add('<span class="c">// Ejecuta el programa con las flechas</span>');
    add('<span class="k">let</span> jugador = { x: <span class="val" id="vpx">0</span>, y: <span class="val" id="vpy">0</span> };');
    add('<span class="k">let</span> meta    = { x: <span class="val" id="vgx">?</span>, y: <span class="val" id="vgy">?</span> };');
    add('');
    lv.defs.forEach(function (df) {
      add('<span class="k">function</span> <span class="f">' + df.name + '</span>(' + (df.count ? 'dir, veces' : df.param ? 'dir' : '') + ') {' +
        (df.param ? '<span class="live"></span>' : ''), df, 0);
      df.body.forEach(function (b) { renderNode(b, 1); });
      add('}');
      add('');
    });
    lv.prog.forEach(function (n) { renderNode(n, 0); });

    codeOl.innerHTML = '';
    lis = rows.map(function (r) {
      var li = document.createElement('li');
      var tabs = '';
      for (var i = 0; i < r.l; i++) tabs += '<span class="tab"></span>';
      li.innerHTML = tabs + '<span class="txt">' + r.h + '</span>';
      codeOl.appendChild(li);
      return li;
    });
    codeOl.scrollTop = 0;
  }

  function clearLive() { codeOl.querySelectorAll('.live').forEach(function (s) { s.textContent = ''; }); }
  function clearMarks() { lis.forEach(function (li) { li.classList.remove('run', 'bad', 'good', 'askline'); }); clearPhases(); }
  function scrollToLine(li) {
    if (li.offsetTop < codeOl.scrollTop + 8) codeOl.scrollTop = Math.max(0, li.offsetTop - 8);
    else if (li.offsetTop + li.offsetHeight > codeOl.scrollTop + codeOl.clientHeight - 8) codeOl.scrollTop = li.offsetTop + li.offsetHeight - codeOl.clientHeight + 8;
  }
  function mark(nodes, cls) {
    clearMarks();
    nodes.forEach(function (n) { lis[n.line].classList.add(cls); });
    scrollToLine(lis[nodes[nodes.length - 1].line]);
  }

  /* ---------- Explicación ---------- */
  // Animación de las 4 partes de un bucle: inicialización, comprobación, cuerpo, aumento
  var PHASE_MS = 420, phaseTimers = [];
  function clearPhases() {
    phaseTimers.forEach(clearTimeout); phaseTimers = [];
    lis.forEach(function (li) { li.classList.remove('phase'); });
    codeOl.querySelectorAll('.ph.on').forEach(function (sp) { sp.classList.remove('on', 'exit'); });
  }
  function applyPhase(step, idx) {
    var ph = step.phases[idx], li = ph.node && lis[ph.node.line];
    if (!li) return;
    lis.forEach(function (l) { l.classList.remove('phase'); });
    codeOl.querySelectorAll('.ph.on').forEach(function (sp) { sp.classList.remove('on', 'exit'); });
    var span = null;
    if (ph.node.t === 'for') span = li.querySelector(ph.k === 'init' ? '.ph-init' : ph.k === 'inc' ? '.ph-inc' : '.ph-cond');
    else if (ph.node.t === 'wc' && (ph.k === 'cond' || ph.k === 'exit')) span = li.querySelector('.ph-cond');
    if (span) { span.classList.add('on'); if (ph.k === 'exit') span.classList.add('exit'); }
    else li.classList.add('phase');
    explainEl.querySelectorAll('.phl li').forEach(function (it, i) { it.classList.toggle('on', i === idx); it.classList.toggle('past', i < idx); });
    scrollToLine(li);
  }
  function playPhases(step) {
    clearPhases();
    if (!step.phases || !step.phases.length) return;
    step.phases.forEach(function (p, i) { phaseTimers.push(setTimeout(function () { applyPhase(step, i); }, i * PHASE_MS)); });
  }

  function explain(head, items, cls, phases) {
    var phl = (phases && phases.length)
      ? '<ol class="phl">' + phases.map(function (p, i) { return '<li data-i="' + i + '">' + fmt(p.text) + '</li>'; }).join('') + '</ol>' : '';
    explainEl.innerHTML = '<div class="ex-head ' + (cls || '') + '">' + fmt(head) + '</div>' + phl +
      (items.length ? '<ul>' + items.map(function (s) { return '<li>' + fmt(s) + '</li>'; }).join('') + '</ul>' : '');
    explainEl.scrollTop = 0;
  }
  function moveLine(step) {
    for (var i = step.lines.length - 1; i >= 0; i--) {
      var t = step.lines[i].t;
      if (t === 'move' || t === 'movevar' || t === 'movevarg') return step.lines[i].line + 1;
    }
    return step.lines[step.lines.length - 1].line + 1;
  }
  function explainIntro() {
    var items = ['Pulsa la flecha de cada `mover()` en el orden en que se ejecutaría el programa.'];
    if (!state.goalShown) items.push('La meta está oculta: llegarás a ella solo si ejecutas bien el código.');
    items.push('Después de cada paso, aquí te explico por qué el programa hizo eso.');
    explain('Qué hace cada línea', items);
  }
  function explainStep(step) {
    explain('mover("' + NAMES[step.d] + '") · línea ' + moveLine(step), (step.why || []).concat(step.post || []), '', step.phases);
  }

  /* ---------- Pregunta ---------- */
  function hideAsk() {
    askEl.hidden = true;
    askEl.classList.remove('answered', 'enter', 'shake');
    lis.forEach(function (li) { li.classList.remove('askline'); });
  }
  function showAsk(q) {
    q.shown = true; state.locked = true;
    askQ.innerHTML = '<span class="ask-line">línea ' + (q.line + 1) + '</span>' + fmt(q.text);
    askOpts.innerHTML = '';
    askMsg.className = 'ask-msg';
    askMsg.textContent = 'Predice antes de ejecutar (puedes pulsar 1, 2, 3…).';
    q.options.forEach(function (o, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.innerHTML = '<kbd>' + (i + 1) + '</kbd>' + fmt(o.label);
      b.addEventListener('click', function () { answer(i); });
      askOpts.appendChild(b);
    });
    askEl.classList.remove('answered', 'shake');
    askEl.hidden = false;
    retrigger(askEl, 'enter');
    if (lis[q.line]) { lis[q.line].classList.add('askline'); scrollToLine(lis[q.line]); }
    askEl.scrollIntoView({ block: 'nearest', behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  }
  function answer(i) {
    var q = state.question;
    if (!q || !q.shown || q.done) return;
    var o = q.options[i];
    if (!o) return;
    var btn = askOpts.children[i];
    if (o.ok) {
      q.done = true;
      btn.classList.add('right');
      Array.prototype.forEach.call(askOpts.children, function (b) { b.disabled = true; });
      askMsg.className = 'ask-msg ok';
      askMsg.innerHTML = '✓ ' + fmt(q.good);
      askEl.classList.add('answered');
      state.locked = false;
    } else {
      btn.classList.add('wrong'); btn.disabled = true;
      state.levelFails++;
      askMsg.className = 'ask-msg bad';
      askMsg.innerHTML = '✗ ' + fmt(q.hint);
      retrigger(askEl, 'shake');
    }
  }
  function maybeAsk() {
    var q = state.question;
    if (!q || q.done || state.demo || state.stepIndex !== q.at) return;
    showAsk(q);
  }

  /* ---------- Tablero y estado ---------- */
  function paintBoard() {
    for (var y = 0; y < N; y++) for (var x = 0; x < N; x++) {
      var el = cells[y * N + x];
      el.className = 'cell';
      el.style.removeProperty('--d');
      if (state.blocks[key(x, y)]) el.classList.add('block');
      if (state.goalShown && x === state.goal.x && y === state.goal.y) el.classList.add('goal');
    }
  }
  function updateGoalText() {
    var a = document.getElementById('vgx'), b = document.getElementById('vgy');
    if (a) a.textContent = state.goalShown ? state.goal.x : '?';
    if (b) b.textContent = state.goalShown ? state.goal.y : '?';
    hintBtn.hidden = state.goalShown;
  }
  function revealGoal() {
    if (state.goalShown) return;
    state.goalShown = true;
    cells[state.goal.y * N + state.goal.x].classList.add('goal');
    updateGoalText();
  }
  function placePlayer(p) {
    playerEl.style.setProperty('--x', p.x);
    playerEl.style.setProperty('--y', p.y);
  }
  function paintValues() {
    var a = document.getElementById('vpx'), b = document.getElementById('vpy');
    if (a) a.textContent = state.player.x;
    if (b) b.textContent = state.player.y;
    document.getElementById('sStep').textContent = state.stepIndex + '/' + state.trace.length;
    document.getElementById('sFails').textContent = state.fails;
    document.getElementById('title').textContent = 'Nivel ' + state.level + ': ' + levelTitle(state.level);
  }

  function showBanner(text, cls) {
    banner.textContent = text;
    banner.className = 'banner ' + cls;
    void banner.offsetWidth;
    banner.classList.add('show');
    later(function () { banner.classList.remove('show'); }, 1000);
  }

  function paintTip(plan) {
    var has = {};
    plan.forEach(function (t) { has[t] = 1; });
    var h = '';
    if (has['for'] || has['vfor'] || has['vforop'] || has['callf'] || has['callpf'] || has['vfunc']) {
      h += '<p>Un <code>for</code> tiene 4 partes que se ejecutan siempre en este orden: ① inicialización <code>let i = 0</code> (solo la primera vez), ② comprobación <code>i &lt; 3</code>, ③ cuerpo y ④ aumento <code>i++</code>. Después se vuelve a la ②; cuando la comprobación es falsa, el <code>for</code> termina.</p>' +
        '<p><code>i++</code> es lo mismo que <code>i = i + 1</code> y que <code>i += 1</code>: suma 1 a <code>i</code>.</p>';
    }
    if (has['if']) h += '<p><code>bloqueado("dir")</code> es verdadero si, desde donde estás ahora, hay un círculo rojo o el borde del tablero en esa dirección. Si es verdadero se ejecuta el primer bloque; si no, el <code>else</code>.</p>';
    if (has['while']) h += '<p><code>while</code> repite mientras su condición se cumpla: avanzas hasta que <code>bloqueado(dir)</code> sea verdadero.</p>';
    if (has['decoy']) h += '<p>Escribir <code>function nombre() { … }</code> solo define la función. Se ejecuta únicamente donde aparece <code>nombre();</code>.</p>';
    var hasFn = has['call'] || has['callp'] || has['callf'] || has['callpf'] || has['calln'] || has['vfunc'];
    if (hasFn) h += '<p>Una función agrupa líneas con un nombre y no hace nada hasta que se la llama. Cada llamada ejecuta todo su cuerpo, y puede llamarse varias veces.</p>';
    if (has['callp'] || has['callpf']) h += '<p>En <code>avanzar("abajo")</code> el parámetro <code>dir</code> vale <code>"abajo"</code> mientras dura esa llamada.</p>';
    if (has['callf'] || has['callpf']) h += '<p>Si una función contiene un <code>for</code>, cada llamada ejecuta todas sus vueltas.</p>';
    if (has['calln']) h += '<p>Una función puede llamar a otra: cuando la interna termina, la externa sigue con su siguiente línea.</p>';
    var hasVar = has['vdir'] || has['vfor'] || has['vforop'] || has['vwhile'] || has['vwhile2'] || has['vif'] || has['vfunc'];
    if (hasVar) h += '<p>Una variable guarda un valor con nombre; si se reasigna, cambia para las líneas siguientes.</p>';
    if (has['vforop'] || has['vfor']) h += '<p>El bucle repite tantas veces como valga la variable en ese momento. Las operaciones (<code>+</code>, <code>-</code>, <code>*</code>) se resuelven en orden.</p>';
    if (has['vwhile'] || has['vwhile2']) h += '<p>Un <code>while</code> con contador tiene las mismas 4 partes que un <code>for</code>: ① <code>let c = 0</code> antes del bucle, ② comprobación, ③ cuerpo y ④ aumento, que ahora escribes tú dentro del bloque. <code>c++</code>, <code>c += 1</code> y <code>c = c + 1</code> hacen lo mismo (suman 1); <code>c += 2</code> equivale a <code>c = c + 2</code>. Con <code>&lt;=</code> el límite también cuenta.</p>';
    if (has['vif']) h += '<p><code>%</code> es el resto de dividir: <code>n % 2 == 0</code> es verdadero si <code>n</code> es par. <code>==</code> compara si dos valores son iguales.</p>';
    if (has['vfunc']) h += '<p>Los argumentos pueden ser variables u operaciones (<code>pasos + 1</code>): se calculan antes de entrar en la función.</p>';
    tipEl.innerHTML = h;
  }

  /* ---------- Demostración paso a paso ---------- */
  function cancelDemo() {
    if (demoTimer) { clearTimeout(demoTimer); demoTimer = null; }
    state.demo = false;
    demoBtn.textContent = '▶ Ver ejecución';
  }
  function resetRun() {
    timers.forEach(clearTimeout); timers = [];
    banner.classList.remove('show');
    wrap.classList.remove('flash-good', 'flash-bad', 'shake');
    playerEl.classList.remove('hurt');
    state.stepIndex = 0;
    state.player = { x: state.start.x, y: state.start.y };
    playerEl.style.transition = 'none';
    placePlayer(state.player);
    void playerEl.offsetWidth;
    playerEl.style.transition = '';
    clearMarks(); clearLive();
    state.locked = false;
    paintValues();
  }
  function endDemo() {
    cancelDemo();
    resetRun();
    if (state.question && !state.question.done) state.question.shown = false;
    explain('Fin de la demostración', ['Ahora ejecútalo tú con las flechas. ¿Podrías explicar con tus palabras qué hizo cada estructura?']);
    maybeAsk();
  }
  function startDemo() {
    if (state.demo) { endDemo(); return; }
    var asking = state.question && state.question.shown && !state.question.done;
    if (state.locked && !asking) return;
    hideAsk();
    resetRun();
    state.demo = true;
    state.levelFails++;               // ver la solución cuenta como ayuda
    revealGoal();
    demoBtn.textContent = '■ Parar';
    var i = 0;
    (function tick() {
      if (!state.demo) return;
      if (i >= state.trace.length) return;
      var stp = state.trace[i];
      press(stp.d, true);
      i++;
      if (i < state.trace.length) demoTimer = setTimeout(tick, Math.max(1500, (stp.phases || []).length * PHASE_MS + 700));
    })();
  }

  /* ---------- Flujo de niveles ---------- */
  function loadLevel() {
    cancelDemo();
    clearPhases();
    timers.forEach(clearTimeout); timers = [];
    banner.classList.remove('show');
    wrap.classList.remove('flash-good', 'flash-bad', 'shake');
    playerEl.classList.remove('hurt');
    var lv = makeLevel(state.level);
    state.start = lv.start; state.goal = lv.goal; state.blocks = lv.blocks;
    state.trace = lv.trace; state.prog = lv.prog;
    state.stepIndex = 0; state.player = { x: lv.start.x, y: lv.start.y };
    state.goalShown = state.level < HIDE_GOAL_FROM;
    buildCode(lv);
    updateGoalText();
    paintBoard();
    playerEl.style.transition = 'none';
    placePlayer(state.player);
    void playerEl.offsetWidth;
    playerEl.style.transition = '';
    state.locked = false;
    if (state.lastLoaded !== state.level) { state.levelFails = 0; state.lastLoaded = state.level; }
    state.question = buildQuestion(lv);
    hideAsk();
    paintTip(lv.plan);
    paintValues();
    renderProgress();
    explainIntro();
    maybeAsk();
  }

  function restartProgram() {
    cancelDemo();
    hideAsk();
    resetRun();
    if (state.question && !state.question.done) state.question.shown = false;
    explainIntro();
    maybeAsk();
  }

  function fail(pressed, exp) {
    state.fails++; state.levelFails++; state.locked = true;
    var curDot = trackEl.querySelector('.current');
    if (curDot) retrigger(curDot, 'oops');
    var prev = state.trace[state.stepIndex - 1];
    var items = [];
    if (prev) (prev.phases || []).filter(function (p) { return p.k === 'inc' || p.k === 'exit'; }).forEach(function (p) { items.push(p.text); });
    (exp.phases || []).filter(function (p) { return p.k === 'init' || p.k === 'cond'; }).forEach(function (p) { items.push(p.text); });
    items = items.concat((prev && prev.post) || [], exp.why || []);
    if (!items.length) items.push('Ejecuta el código en orden, línea por línea.');
    explain('✗ Pulsaste ' + NAMES[pressed] + ', pero la línea ' + moveLine(exp) + ' pedía mover("' + NAMES[exp.d] + '")', items, 'bad');
    mark(exp.lines, 'bad');

    var nx = state.player.x + DIRS[pressed][0], ny = state.player.y + DIRS[pressed][1];
    if (inB(nx, ny)) { state.player = { x: nx, y: ny }; placePlayer(state.player); }
    retrigger(wrap, 'shake');
    wrap.classList.add('flash-bad');
    playerEl.classList.add('hurt');
    showBanner('¡Fallo!', 'bad');
    later(function () { wrap.classList.remove('flash-bad'); }, 600);
    later(function () {
      state.player = { x: state.start.x, y: state.start.y };
      state.stepIndex = 0;
      placePlayer(state.player);
      paintValues();
    }, 30);
    later(function () {
      playerEl.classList.remove('hurt');
      clearMarks(); clearLive();
      state.locked = false;
    }, 1000);
    paintValues();
  }

  function win() {
    state.locked = true;
    var last = state.trace[state.trace.length - 1];
    mark(last.lines, 'good');
    if (state.demo) {
      cancelDemo();
      showBanner('Fin de la demostración', 'info');
      later(function () { endDemo(); }, 2600);
      return;
    }
    var idx = Math.min(state.level, LEVELS.length + 1);
    done[idx] = (state.levelFails === 0 || done[idx] === 'ok') ? 'ok' : 'retry';
    saveDone();
    renderProgress(idx);
    explain('✓ Programa completo', (last.why || []).concat(last.post || []), 'good', last.phases);
    revealGoal();
    wrap.classList.add('flash-good');
    showBanner('¡Acierto!', 'good');
    var g = state.goal;
    cells.forEach(function (el, i) {
      var x = i % N, y = Math.floor(i / N);
      el.style.setProperty('--d', Math.abs(x - g.x) + Math.abs(y - g.y));
      el.classList.remove('wave'); void el.offsetWidth; el.classList.add('wave');
    });
    later(function () { state.level++; loadLevel(); }, 2200);
  }

  function press(dir, fromDemo) {
    if (state.demo && !fromDemo) return;
    if (state.locked) return;
    var exp = state.trace[state.stepIndex];
    hideAsk();
    if (dir !== exp.d) { fail(dir, exp); return; }

    state.player = { x: state.player.x + DIRS[dir][0], y: state.player.y + DIRS[dir][1] };
    placePlayer(state.player);
    retrigger(playerEl, 'pop');
    state.stepIndex++;
    clearLive();
    var groups = {};
    (exp.live || []).forEach(function (l) {
      var g = groups[l.node.line] || (groups[l.node.line] = []);
      if (g.indexOf(l.text) < 0) g.push(l.text);
    });
    Object.keys(groups).forEach(function (ln) {
      var span = lis[ln].querySelector('.live');
      if (span) span.textContent = '// ' + groups[ln].join(', ');
    });
    paintValues();
    explainStep(exp);
    if (state.stepIndex >= state.trace.length) { win(); playPhases(exp); return; }
    mark(exp.lines, 'run');
    playPhases(exp);
    maybeAsk();
  }

  document.addEventListener('keydown', function (e) {
    var q = state.question;
    if (q && q.shown && !q.done && /^[1-9]$/.test(e.key)) { e.preventDefault(); answer(parseInt(e.key, 10) - 1); return; }
    var dir = KEYS[e.key];
    if (!dir) return;
    e.preventDefault();
    if (e.repeat) return;
    press(dir);
  });
  document.querySelectorAll('.pad button').forEach(function (b) {
    b.addEventListener('click', function () { press(b.dataset.dir); });
  });
  var resetBtn = document.getElementById('resetProg'), resetTimer = null;
  resetBtn.addEventListener('click', function () {
    if (!resetTimer) {
      resetBtn.textContent = '¿Seguro? Pulsa otra vez';
      resetTimer = setTimeout(function () { resetBtn.textContent = 'Borrar progreso'; resetTimer = null; }, 3000);
      return;
    }
    clearTimeout(resetTimer); resetTimer = null;
    resetBtn.textContent = 'Borrar progreso';
    done = {}; saveDone();
    state.level = 1; state.fails = 0;
    loadLevel();
  });
  demoBtn.addEventListener('click', function () { startDemo(); demoBtn.blur(); });
  hintBtn.addEventListener('click', function () {
    if (state.goalShown) return;
    revealGoal();
    state.levelFails++;               // pedir la meta cuenta como ayuda
    hintBtn.blur();
  });
  document.getElementById('restart').addEventListener('click', function () { restartProgram(); this.blur(); });
  document.getElementById('another').addEventListener('click', function () { loadLevel(); this.blur(); });

  loadLevel();
})();
</script>
</body>
</html>
